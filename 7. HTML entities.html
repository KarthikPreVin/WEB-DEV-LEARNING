<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html entities</title>
</head>
<body>
    <h3>

        <div class="container">
            html doesnt accept mutliple spaces,hence we use entities like &nbsp;
        </div>
        <div class="container">so now,          this becomes &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;this</div>
    </h3>
    <h2>
        <div>
            <br>
            <div>
                <ul>
                    basic html entities
                    <li>non breaking space :- &nbsp;</li>
                    <li>lessthan tag :- &lt; </li>
                    <li>greaterthan tag :- &gt;</li>
                    <li>pound :- &pound; </li>
                    <li>copyright symbol :- &copy;</li>
                    <li><strong>empty charater in html : &#8203; </strong></li>
                </ul>
                <a href="https://www.htmlquick.com/reference/character-entity-reference.html">for more entities CLICK!</a>

            </div>
        </div>
        
    </h2>

</body>
</html>
