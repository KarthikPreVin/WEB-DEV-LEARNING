<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>elements in html</title>
</head>

<body>
    <!-- adding links/anchors -->
    <h3>
        <a href="https://www.google.com" target="_blank">go to google</a><br>
        <a href="https://www.tneaonline.org/u/home" target="_blank">go to tnea home page</a><br>
        <a href="https://ugresults.vit.ac.in/viteee/" target="_blank">go to viteee page</a><br>
        <a href="/basics.html" target="_blank">basics html</a>
    </h3>
    <p>
        adding images<br>
        <!-- image present -->
        <img src="https://via.placeholder.com/100x100" alt="Error loading image"> <br>
        <!-- image not present -->
        <img src="/10x10" alt="Error loading image"> <br>
    </p>
    <!-- types are disc,circle,square -->

    <!-- lists -->


    <ul type="disc">types are disc, circle, square
        <li>first</li>
        <li>second</li>
        <li>third</li>
    </ul>
    <!-- types are A,a,i,I,1 -->
    <ol type="i"> types are A, a, i, I, 1
        <li>first</li>
        <li>second</li>
        <li>third</li>
    </ol>


    
</body>

</html>
